name: CI

on:
  pull_request:
  push:
    branches: [main]

# Batalkan run lama bila ada push baru di branch/PR yang sama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI hanya perlu membaca repo.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci memasang persis sesuai package-lock.json.
      # Jangan diganti npm install: hasilnya tidak deterministik.
      - name: Install dependencies
        run: npm ci

      # WAJIB sebelum typecheck: PageProps/LayoutProps dan tipe route
      # baru dibuat oleh langkah ini. Tanpa ini, tsc gagal di checkout bersih.
      - name: Generate route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
